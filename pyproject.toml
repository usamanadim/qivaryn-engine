[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qivaryn-engine"
version = "0.2.0"
description = "A multi-platform media download engine for Instagram, TikTok, YouTube and Facebook."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Qivaryn-Attribution-1.0"
license-files = ["LICENSE"]
authors = [
    { name = "Usama Nadeem (@usamanadim)" }
]
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "tqdm>=4.64.0"
]

[project.urls]
Homepage = "https://github.com/usamanadim/qivaryn-engine"
Repository = "https://github.com/usamanadim/qivaryn-engine"
Issues = "https://github.com/usamanadim/qivaryn-engine/issues"

[project.scripts]
qivaryn = "qivaryn.cli:cli"

[tool.setuptools.packages.find]
include = ["qivaryn*"]

[tool.setuptools.package-data]
qivaryn = ["ATTRIBUTION.json"]